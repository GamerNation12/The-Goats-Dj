name: Automate GitHub Releases

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Update Size (none = build current version as-is)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      build_pc:
        description: 'Build PC App (.exe)'
        required: true
        type: boolean
        default: true
      build_android:
        description: 'Build Android App (.apk)'
        required: true
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux App (.AppImage/.deb)'
        required: true
        type: boolean
        default: true

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/android/gradle/wrapper/gradle-wrapper.properties', 'android-app/android/app/build.gradle', 'android-app/android/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Auto-Bump Versions
        id: version_bump
        run: |
          git config --global user.name "GamerNation12"
          git config --global user.email "GamerNation12@users.noreply.github.com"

          if ("${{ github.event.inputs.bump }}" -eq "none") {
            $VERSION = node -p "require('./desktop-app/package.json').version"
            $TAG = "v$VERSION"
            echo "NEW_VERSION=$TAG" >> $env:GITHUB_OUTPUT
            exit 0
          }

          cd desktop-app
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          $VERSION = node -p "require('./package.json').version"
          $TAG = "v$VERSION"
          echo "NEW_VERSION=$TAG" >> $env:GITHUB_OUTPUT
          cd ..

          cd android-app
          $content = Get-Content pubspec.yaml -Raw
          $content = [System.Text.RegularExpressions.Regex]::Replace($content, 'version: \d+\.\d+\.\d+\+(\d+)', { param($m) "version: $VERSION+" + ([int]$m.Groups[1].Value + 1) })
          Set-Content pubspec.yaml $content -NoNewline
          cd ..

          git add desktop-app/package.json desktop-app/package-lock.json android-app/pubspec.yaml
          git commit -m "chore: auto-bump version to $TAG"
          git tag $TAG
          git push origin HEAD --follow-tags

      - name: Install Desktop App Dependencies
        if: ${{ github.event.inputs.build_pc == 'true' }}
        working-directory: desktop-app
        run: npm install

      - name: Build Windows Executable
        if: ${{ github.event.inputs.build_pc == 'true' }}
        working-directory: desktop-app
        run: npm run build:vite && npx electron-builder -w --publish never

      - name: Build Android APK
        if: ${{ github.event.inputs.build_android == 'true' }}
        working-directory: android-app
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons
          flutter build apk --release
          cd build/app/outputs/flutter-apk/
          Rename-Item app-release.apk DJ-Scratch.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.NEW_VERSION }}
          name: DJ Scratch ${{ steps.version_bump.outputs.NEW_VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          # Upload everything that was successfully built in the previous steps
          files: |
            desktop-app/dist2/*.exe
            desktop-app/dist2/*.exe.blockmap
            desktop-app/dist2/latest.yml
            android-app/build/app/outputs/flutter-apk/DJ-Scratch.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    # Runs after the Windows job so version bumps are already pushed to main.
    needs: build-and-release
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release tag
        id: tag
        working-directory: desktop-app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Desktop App Dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build Linux packages
        working-directory: desktop-app
        run: npm run build:vite && npx electron-builder -l --publish never

      - name: Upload Linux assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: DJ Scratch ${{ steps.tag.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            desktop-app/dist2/*.AppImage
            desktop-app/dist2/*.deb
            desktop-app/dist2/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
