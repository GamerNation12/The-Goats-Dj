name: dj_scratch
description: "DJ Scratch — music stats dashboard (v1 rebuild)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_web_auth_2: ^3.1.1
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  lucide_icons: ^0.257.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
